# Self-hosted Convex: the backend (database, file storage, functions) and its
# admin dashboard. Settings come from .env next to this file (see .env.example).
#
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh   # admin key for the CLI and dashboard
#
# Data lives in the `data` volume; back it up before upgrading the images.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Convex API (CONVEX_URL): queries, mutations, file uploads, the CLI.
      - "${PORT:-3210}:3210"
      # HTTP actions (CONVEX_SITE_URL): pictures at /img/... and sign-in.
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-}
      - INSTANCE_SECRET=${INSTANCE_SECRET:-}
      # The public addresses of the two ports above, as browsers reach them.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      # Mux processing can take a few minutes (see convex/mux.ts).
      - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-600}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Keep this port private (firewall or VPN): the dashboard can edit all data.
      - "127.0.0.1:${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
